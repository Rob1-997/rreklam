# Local development only. Change all passwords before any remote deployment.
# MinIO Docker Hub images were retired; pull pinned releases from quay.io instead.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rreklam
      POSTGRES_USER: rreklam
      POSTGRES_PASSWORD: rreklam_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rreklam-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rreklam -d rreklam"]
      interval: 5s
      retries: 15
  minio:
    # Optional: not needed for owner panel. Enable with --profile media after registry access is resolved.
    profiles: ["media"]
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rreklam_dev
      MINIO_ROOT_PASSWORD: rreklam_storage_local_only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rreklam-media:/data
  minio-init:
    profiles: ["media"]
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 rreklam_dev rreklam_storage_local_only; do sleep 2; done;
      mc mb --ignore-existing local/rreklam-private;
      "
volumes:
  rreklam-postgres:
  rreklam-media:
